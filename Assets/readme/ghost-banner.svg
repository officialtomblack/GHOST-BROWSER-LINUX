<rect x="76" y="48" width="88" height="10" fill="#55F5A0" fill-opacity="0.35"><animate attributeName="y" values="48;146;48" dur="4s" repeatCount="indefinite"/></rect></g>
<path d="M80 152 V92 a40 40 0 0 1 80 0 V152 l-13 -12 l-13 12 l-14 -12 l-14 12 l-13 -12 Z" fill="none" stroke="#55F5A0" stroke-width="1.6"/>
<circle cx="106" cy="92" r="6" fill="#060A08" stroke="#55F5A0" stroke-width="1.4"/><circle cx="134" cy="92" r="6" fill="#060A08" stroke="#55F5A0" stroke-width="1.4"/>
</g>
<g font-family="monospace" font-size="9" fill="#4A6B5A"><text x="62" y="24">sealed network</text><text x="62" y="184">RAM only</text></g>
<text x="232" y="88" font-family="monospace" font-size="42" font-weight="bold" fill="#55F5A0" letter-spacing="4">GHOST BROWSER</text>
<rect x="614" y="54" width="16" height="36" fill="#55F5A0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
