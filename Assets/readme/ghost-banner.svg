<clipPath id="g"><path d="M80 152 V92 a40 40 0 0 1 80 0 V152 l-13 -12 l-13 12 l-14 -12 l-14 12 l-13 -12 Z"/></clipPath>
<pattern id="scan" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="1.6" fill="#55F5A0" fill-opacity="0.55"/></pattern>
