<svg viewBox="0 0 680 816" width="680" height="816" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One click, twenty steps: what Ghost Browser does before and after the window opens">
<rect x="1" y="1" width="678" height="814" rx="22" fill="#060A08" stroke="#17261D"/>
<g font-family="monospace">
<text x="40" y="42" font-size="20" font-weight="bold" fill="#55F5A0" letter-spacing="2">YOU CLICK ONE ICON.</text>
<text x="40" y="62" font-size="12" fill="#9FB5AA" letter-spacing="1">Here is everything that happens, in order. Any "stop" = no browser.</text>
<text x="40" y="92" font-size="11" fill="#4DA6FF" letter-spacing="2">BEFORE ANYTHING IS BUILT</text><line x1="40" y1="99" x2="640" y2="99" stroke="#17261D"/>
<rect x="40" y="107" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="120" font-size="11" fill="#4DA6FF" text-anchor="middle">01</text><text x="84" y="120" font-size="12" fill="#D7E4DC">Refuses to run as root</text>
<rect x="40" y="131" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="144" font-size="11" fill="#4DA6FF" text-anchor="middle">02</text><text x="84" y="144" font-size="12" fill="#D7E4DC">Reads your settings as plain text. They are never run as code</text>
<rect x="40" y="155" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="168" font-size="11" fill="#4DA6FF" text-anchor="middle">03</text><text x="84" y="168" font-size="12" fill="#D7E4DC">Confirms the browser's folder will be in RAM. On a disk? It stops</text>
<rect x="40" y="179" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="192" font-size="11" fill="#4DA6FF" text-anchor="middle">04</text><text x="84" y="192" font-size="12" fill="#D7E4DC">Makes a fresh, empty folder in RAM for this one session</text>
<rect x="40" y="203" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="216" font-size="11" fill="#4DA6FF" text-anchor="middle">05</text><text x="84" y="216" font-size="12" fill="#D7E4DC">Picks a random VPN server from your list</text>
<rect x="40" y="227" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="240" font-size="11" fill="#4DA6FF" text-anchor="middle">06</text><text x="84" y="240" font-size="12" fill="#D7E4DC">Your own VPN file? Checks it line by line: full tunnel, yours only</text>
<rect x="40" y="251" width="30" height="18" rx="4" fill="none" stroke="#4DA6FF"/><text x="55" y="264" font-size="11" fill="#4DA6FF" text-anchor="middle">07</text><text x="84" y="264" font-size="12" fill="#D7E4DC">Notes which network your computer is on, to bar the browser from it</text>
<text x="40" y="302" font-size="11" fill="#F5B84D" letter-spacing="2">BUILDING THE SEALED NETWORK</text><line x1="40" y1="309" x2="640" y2="309" stroke="#17261D"/>
<rect x="40" y="317" width="30" height="18" rx="4" fill="none" stroke="#F5B84D"/><text x="55" y="330" font-size="11" fill="#F5B84D" text-anchor="middle">08</text><text x="84" y="330" font-size="12" fill="#D7E4DC">Asks for your password  (the only step you see)</text>
<rect x="40" y="341" width="30" height="18" rx="4" fill="none" stroke="#F5B84D"/><text x="55" y="354" font-size="11" fill="#F5B84D" text-anchor="middle">09</text><text x="84" y="354" font-size="12" fill="#D7E4DC">Creates a brand-new, empty network: own cards, routes, firewall</text>
<rect x="40" y="365" width="30" height="18" rx="4" fill="none" stroke="#F5B84D"/><text x="55" y="378" font-size="11" fill="#F5B84D" text-anchor="middle">10</text><text x="84" y="378" font-size="12" fill="#D7E4DC">Starts a VPN tunnel inside it</text>
<rect x="40" y="389" width="30" height="18" rx="4" fill="none" stroke="#F5B84D"/><text x="55" y="402" font-size="11" fill="#F5B84D" text-anchor="middle">11</text><text x="84" y="402" font-size="12" fill="#D7E4DC">Firewall on: anything not going through the tunnel is rejected</text>
<rect x="40" y="413" width="30" height="18" rx="4" fill="none" stroke="#F5B84D"/><text x="55" y="426" font-size="11" fill="#F5B84D" text-anchor="middle">12</text><text x="84" y="426" font-size="12" fill="#D7E4DC">IPv6 off. Name lookups (DNS) go to the VPN's own servers</text>
<text x="40" y="464" font-size="11" fill="#FF5C6C" letter-spacing="2">PROVING IT, FROM THE INSIDE</text><line x1="40" y1="471" x2="640" y2="471" stroke="#17261D"/>
<rect x="40" y="479" width="30" height="18" rx="4" fill="none" stroke="#FF5C6C"/><text x="55" y="492" font-size="11" fill="#FF5C6C" text-anchor="middle">13</text><text x="84" y="492" font-size="12" fill="#D7E4DC">Is this really a separate network? Can't tell = stop</text>
<rect x="40" y="503" width="30" height="18" rx="4" fill="none" stroke="#FF5C6C"/><text x="55" y="516" font-size="11" fill="#FF5C6C" text-anchor="middle">14</text><text x="84" y="516" font-size="12" fill="#D7E4DC">Does the road to the internet go through the tunnel? No = stop</text>
<rect x="40" y="527" width="30" height="18" rx="4" fill="none" stroke="#FF5C6C"/><text x="55" y="540" font-size="11" fill="#FF5C6C" text-anchor="middle">15</text><text x="84" y="540" font-size="12" fill="#D7E4DC">Is it a full tunnel, the kind that gets the kill switch? No = stop</text>
<rect x="40" y="551" width="30" height="18" rx="4" fill="none" stroke="#FF5C6C"/><text x="55" y="564" font-size="11" fill="#FF5C6C" text-anchor="middle">16</text><text x="84" y="564" font-size="12" fill="#D7E4DC">Is the VPN server alive? Dead = tear it all down, try another</text>
<text x="40" y="602" font-size="11" fill="#55F5A0" letter-spacing="2">OPENING</text><line x1="40" y1="609" x2="640" y2="609" stroke="#17261D"/>
<rect x="40" y="617" width="30" height="18" rx="4" fill="none" stroke="#55F5A0"/><text x="55" y="630" font-size="11" fill="#55F5A0" text-anchor="middle">17</text><text x="84" y="630" font-size="12" fill="#D7E4DC">Points the browser's home and temp folders at the RAM folder</text>
<rect x="40" y="641" width="30" height="18" rx="4" fill="none" stroke="#55F5A0"/><text x="55" y="654" font-size="11" fill="#55F5A0" text-anchor="middle">18</text><text x="84" y="654" font-size="12" fill="#D7E4DC">Starts a stock, untouched Mullvad Browser with a blank profile</text>
<text x="40" y="692" font-size="11" fill="#9FB5AA" letter-spacing="2">WHEN YOU CLOSE IT</text><line x1="40" y1="699" x2="640" y2="699" stroke="#17261D"/>
<rect x="40" y="707" width="30" height="18" rx="4" fill="none" stroke="#9FB5AA"/><text x="55" y="720" font-size="11" fill="#9FB5AA" text-anchor="middle">19</text><text x="84" y="720" font-size="12" fill="#D7E4DC">The sealed network is torn down</text>
<rect x="40" y="731" width="30" height="18" rx="4" fill="none" stroke="#9FB5AA"/><text x="55" y="744" font-size="11" fill="#9FB5AA" text-anchor="middle">20</text><text x="84" y="744" font-size="12" fill="#D7E4DC">The RAM folder is wiped: history, cookies, logins, downloads</text>
<text x="40" y="794" font-size="11" fill="#4A6B5A">Every step is in ghost-browser.sh. The "stop" steps are covered by tests.sh.</text>
</g></svg>