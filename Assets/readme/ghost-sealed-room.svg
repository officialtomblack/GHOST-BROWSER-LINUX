<svg viewBox="0 0 680 330" width="680" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your computer on the left is untouched. On the right, a sealed network holds the browser in RAM; its only way out is the VPN tunnel, and the firewall rejects every other path.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55F5A0"/></marker></defs>
<rect x="1" y="1" width="678" height="328" rx="22" fill="#060A08" stroke="#17261D"/>
<g font-family="monospace">
<text x="30" y="34" font-size="11" fill="#9FB5AA" letter-spacing="2">YOUR COMPUTER  (left alone)</text>
<rect x="30" y="46" width="230" height="200" rx="12" fill="none" stroke="#4A6B5A"/>
<g font-size="12" fill="#D7E4DC"><text x="48" y="78">your normal browser</text><text x="48" y="106">your files and apps</text><text x="48" y="134">your own VPN (if any)</text><text x="48" y="162">your normal connection</text></g>
<text x="48" y="222" font-size="10" fill="#4A6B5A">nothing here is changed</text>
<text x="300" y="34" font-size="11" fill="#55F5A0" letter-spacing="2">THE SEALED NETWORK  (built per session)</text>
<rect x="300" y="46" width="350" height="200" rx="12" fill="none" stroke="#55F5A0" stroke-dasharray="6 4"/>
<rect x="320" y="70" width="150" height="74" rx="8" fill="#0C1711" stroke="#55F5A0"/>
<text x="395" y="100" font-size="12" fill="#55F5A0" text-anchor="middle">Ghost Browser</text><text x="395" y="120" font-size="10" fill="#9FB5AA" text-anchor="middle">profile + downloads in RAM</text>
<rect x="520" y="70" width="110" height="74" rx="8" fill="#0C1711" stroke="#4DA6FF"/>
<text x="575" y="100" font-size="12" fill="#4DA6FF" text-anchor="middle">VPN tunnel</text><text x="575" y="120" font-size="10" fill="#9FB5AA" text-anchor="middle">the only exit</text>
<line x1="472" y1="107" x2="516" y2="107" stroke="#55F5A0" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="575" y1="146" x2="575" y2="282" stroke="#55F5A0" stroke-width="1.6" marker-end="url(#a)"/>
<text x="575" y="304" font-size="12" fill="#55F5A0" text-anchor="middle">the internet</text>
<!-- the blocked path -->
<path d="M395 146 V196 H262" fill="none" stroke="#FF5C6C" stroke-width="1.6" stroke-dasharray="5 4"/>
<g stroke="#FF5C6C" stroke-width="2.4"><line x1="322" y1="187" x2="340" y2="205"/><line x1="340" y1="187" x2="322" y2="205"/></g>
<text x="352" y="216" font-size="10" fill="#FF5C6C">any other way out: rejected</text>
<text x="352" y="230" font-size="10" fill="#FF5C6C">(kill switch: on first)</text>
<text x="30" y="282" font-size="11" fill="#F5B84D">VPN drops?</text><text x="110" y="282" font-size="11" fill="#D7E4DC">Pages stop loading. Nothing goes out the other way.</text>
<text x="30" y="304" font-size="11" fill="#F5B84D">You close it?</text><text x="126" y="304" font-size="11" fill="#D7E4DC">The network and the RAM folder are both destroyed.</text>
</g></svg>
